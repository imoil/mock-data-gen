plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management'
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.16'
    }
}

dependencies {
    api project(':mock-data-core')
    api 'org.springframework.boot:spring-boot-starter-web'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    compileOnly 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.15'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.15'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'Mock Data Spring Boot Starter'
                description = 'Spring Boot auto-configuration and HTTP controller starter for deterministic sensor mock data'
            }
        }
    }
}
