name: CI

on:
  push:
    branches: [ main, 'spec-*' ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run build, checks, and local publication verification
        run: ./gradlew clean check publishToMavenLocal --no-daemon --console=plain
