<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에이전트 기반 개발 7단계 프로세스 · Process</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:       #f5f5f5;
      --ink:         #2d3142;
      --muted:       #4f5d75;
      --soft:        #5a6580;
      --accent:      #bf4520;
      --accent-tint: rgba(191,69,32,0.08);
      --rule:        rgba(45,49,66,0.12);
      --label-rule:  rgba(45,49,66,0.20);
      --lane:        rgba(45,49,66,0.018);
      --node:        #ffffff;
      --node-stroke: rgba(45,49,66,0.25);
      --chip:        rgba(45,49,66,0.12);
      --dot:         rgba(45,49,66,0.10);
      --ls:          #7c8f6f;
      --db:          #5e7a9b;
      --fl:          #9c6b50;
      --wb:          #6e6479;
      --gov:         #b85450;
      --qa:          #5a7d9a;
      --pub:         #7a8c47;
      --sans:        'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --serif:       'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --mono:        'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font: 500 0.66rem var(--mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.2 var(--serif);
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font: 400 0.9rem var(--sans);
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }

    .mono { font-family: var(--mono); }
    .sans { font-family: var(--sans); }
    .lane { fill: var(--lane); }
    .rule { stroke: var(--rule); }
    .label-rule { stroke: var(--label-rule); }
    .actor-ko { fill: var(--ink); font: 600 12px var(--sans); }
    .actor-en { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.12em; }
    .step-label { fill: var(--muted); font: 500 12px var(--sans); }
    .step-chip { fill: var(--chip); }
    .step-num { fill: var(--ink); font: 600 8px var(--mono); }
    .connector { fill: none; stroke: var(--muted); stroke-width: 1.1; }
    .connector.focal { stroke: var(--accent); stroke-width: 1.3; }
    .node-mask { fill: var(--paper); }
    .node { fill: var(--node); stroke: var(--node-stroke); }
    .node.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .role { fill: rgba(45,49,66,0.10); }
    .role.focal { fill: rgba(191,69,32,0.22); }
    .role-text { fill: var(--ink); font: 600 7px var(--mono); }
    .role-text.focal { fill: var(--accent); }
    .node-title { fill: var(--ink); font: 600 12px var(--sans); }
    .node-sub { fill: var(--muted); font: 9px var(--mono); }
    .node-tool { fill: var(--soft); font: 9px var(--mono); }
    .data-text { fill: #ffffff; font: 700 7px var(--mono); }
    .legend-key { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .legend-text { fill: var(--muted); font: 500 12px var(--sans); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · End-to-End Agent Lifecycle</p>
    <h1>에이전트 기반 개발 7단계 프로세스</h1>

    <div class="diagram-container">
